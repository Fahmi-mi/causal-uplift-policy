[project]
name = "causal-uplift-policy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "econml>=0.17.1",
    "fastapi>=0.165.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pulp>=4.3.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "scikit-uplift>=0.5.1",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
]
